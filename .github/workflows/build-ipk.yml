name: Build ipk for HomeProxy

on:
  workflow_dispatch:

# GitHub Actions 权限
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source tree
        uses: actions/checkout@v4

      - name: Build ipk file
        env:
          RELEASE_TYPE: ${{ github.event_name }}
        run: |
          pushd .github

          fakeroot bash build-ipk.sh

          echo "===== Search generated IPK ====="
          find . -type f -name "*.ipk" -print

          # 将临时目录中的 IPK 收集到 .github 根目录
          find . -mindepth 2 -type f -name "*.ipk" \
            -exec cp -f {} . \;

          # 检查最终产物
          IPK_FILE=$(find . -maxdepth 1 -type f -name "*.ipk" -print -quit)

          if [ -z "$IPK_FILE" ]; then
            echo "ERROR: IPK file not found!"
            exit 1
          fi

          echo "ASSET_NAME=$(basename "$IPK_FILE")" >> "$GITHUB_ENV"

          ls -lh "$IPK_FILE"

          popd

      - name: Publishing to GitHub Artifacts
        uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: ${{ env.ASSET_NAME }}
          path: .github/${{ env.ASSET_NAME }}
          if-no-files-found: error
          compression-level: 0

      - name: Collect IPK
        run: |
          find .github -type f -name "*.ipk" -print

          IPK_FILE=$(find .github -type f -name "*.ipk" -print -quit)

          if [ -z "$IPK_FILE" ]; then
            echo "ERROR: IPK file not found"
            exit 1
          fi

          mkdir -p release
          cp "$IPK_FILE" release/

          echo "IPK_FILE=$(basename "$IPK_FILE")" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HomeProxy Latest Build
          body: |
            Automated build from master-1.
            Commit: ${{ github.sha }}
          files: release/*.ipk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
